name: Build and release yiju

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/cmdline-tools" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK 目录：$SDK"

      - name: Install Android platform and build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "$ANDROID_HOME/build-tools/33.0.2" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install Gradle 7.6.4
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-7.6.4-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-7.6.4/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: |
          dotnet --version
          java -version
          gradle --version

      - name: Run repository verification
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/verify.py"
          node "$GITHUB_WORKSPACE/tools/net-url.test.mjs"
          bash -n "$GITHUB_WORKSPACE/build.sh"
          bash -n "$GITHUB_WORKSPACE/build-apk.sh"
          bash -n "$GITHUB_WORKSPACE/start.sh"

      - name: Verify upgrade identity and increasing versionCode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          root = os.environ['GITHUB_WORKSPACE']
          cur = json.load(open(os.path.join(root, 'android', 'version.json'), encoding='utf-8'))
          assert cur['applicationId'] == 'app.yiju.archive', 'applicationId 变了会变成另一个 App，无法覆盖升级'
          assert isinstance(cur['versionCode'], int) and cur['versionCode'] > 0, 'versionCode 必须是正整数'
          ref = os.environ.get('GITHUB_REF', '')
          name = os.environ.get('GITHUB_REF_NAME', '')
          if not ref.startswith('refs/tags/'):
              print('分支构建：applicationId=%s versionCode=%s versionName=%s（打 tag 时再校验递增）' % (
                  cur['applicationId'], cur['versionCode'], cur['versionName']))
          else:
              prev = 0
              for t in subprocess.run(['git', 'tag', '-l', 'v*'], capture_output=True, text=True, cwd=root).stdout.split():
                  if t == name:
                      continue
                  try:
                      blob = subprocess.run(['git', 'show', t + ':android/version.json'], capture_output=True, text=True, check=True, cwd=root).stdout
                      prev = max(prev, int(json.loads(blob).get('versionCode', 0)))
                  except Exception:
                      continue
              assert cur['versionCode'] > prev, 'versionCode 必须严格递增：当前 %s，已发布 %s' % (cur['versionCode'], prev)
              print('发布构建：applicationId=%s versionCode=%s versionName=%s（已发布最大值 %s）' % (
                  cur['applicationId'], cur['versionCode'], cur['versionName'], prev))
          PY

      - name: Build server package
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-server.log"
          if ! bash "$GITHUB_WORKSPACE/build.sh" 2>&1 | tee "$log"; then
            echo "::error title=build.sh 失败::$(grep -aE 'FAIL|error CS|错误|Exception' "$log" | tail -12 | tr '\n' '|' | tr '%' ' ')"
            tail -20 "$log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Build signed APK
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-apk.log"
          if ! bash "$GITHUB_WORKSPACE/build-apk.sh" 2>&1 | tee "$log"; then
            echo "::error title=build-apk.sh 失败::$(grep -aE 'FAILURE|error|错误|Exception|Could not' "$log" | tail -12 | tr '\n' '|' | tr '%' ' ')"
            tail -20 "$log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Verify APK signature matches repository keystore
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/yiju.apk"
          test -f "$GITHUB_WORKSPACE/yiju-release.zip"
          test -f "$GITHUB_WORKSPACE/android/keystore/yiju.jks"
          expected=$(keytool -list -v -keystore "$GITHUB_WORKSPACE/android/keystore/yiju.jks" -storepass yijuarchive -alias yiju \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'a-f' 'A-F')
          actual=$(apksigner verify --print-certs "$GITHUB_WORKSPACE/yiju.apk" \
            | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'a-f' 'A-F')
          test -n "$expected"
          test -n "$actual"
          echo "keystore SHA256: $expected"
          echo "apk      SHA256: $actual"
          test "$expected" = "$actual"
          apksigner verify --verbose "$GITHUB_WORKSPACE/yiju.apk"
          {
            echo "### 弈局 yiju 构建结果"
            echo ""
            echo "- applicationId: app.yiju.archive"
            echo "- 签名证书 SHA256: $actual"
            echo "- APK 体积: $(stat -c %s "$GITHUB_WORKSPACE/yiju.apk") 字节"
            echo "- 服务端包: yiju-release.zip $(stat -c %s "$GITHUB_WORKSPACE/yiju-release.zip") 字节"
            echo "- version.json: $(python3 -c "import json,os;v=json.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'],'android','version.json')));print(v['versionCode'], v['versionName'])")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yiju-build
          path: |
            yiju.apk
            yiju-release.zip
            SIZES.txt

      - name: Create GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/v1.0.0-test.1')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: 弈局 yiju v1.0.0 测试版 · 服务端联机实测
          files: |
            yiju.apk
            yiju-release.zip
          body: |
            60 个玩法（含七局原创）、折狱录制本、弈株妆奁 49 件、隐士十阶、神的领域三尊、按最高段位定隐士的房规、分池寻局与进度条。

            房主一键启动 `./start.sh`（Windows `start.bat`），改 `yiju.conf` 即改端口 / 匾额 / 名录 / 校时 / 榜单，可用 `--port 9000 --no-directory` 临时覆盖。棋馆地址支持任意可达地址（局域网 IP / 域名 / IPv6 / 带路径 / 本机回环），端口可省略并补可配置的缺省端口。

            服务器是可选项：本机自弈完全不联网即可使用除多人联机外的全部功能，局域网联机不需外部服务；名录 / 校时 / 榜单默认开启但可全关，失效会自动降级。

            源码公开 · 禁止商用。

            本项目为开源技术分享，不提供官方游戏服务，不构成面向公众的网络游戏运营。游戏核心体验可完全离线进行。任何使用者自行部署、分发或商业化所产生的合规责任（包括但不限于版号、实名制、个人信息保护），由使用者自行承担。

            说明：本版服务端宿主未经实起验证；APK 由 GitHub CI 真实产出，签名沿用仓库内固定 keystore。