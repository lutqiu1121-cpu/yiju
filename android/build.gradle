// 构建前置：JDK 11+、Android SDK（含 platform android-33）、Gradle 7.6.x
// 无任何第三方依赖：只用平台 WebView，APK 体积最小。
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
